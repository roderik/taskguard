[package]
name = "taskguard"
version = "0.1.7"
edition = "2024"
rust-version = "1.89"
description = "A sem that learns what each job needs: start a command only when the machine has room for its CPU and memory"
license = "MIT"
repository = "https://github.com/SpoBo/taskguard"
readme = "README.md"
keywords = ["semaphore", "queue", "monorepo", "turbo", "scheduler"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/taskguard.example.toml"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
libc = "0.2.189"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
toml = "1.1.6"
toml_edit = "0.25.15"

[dev-dependencies]
tempfile = "3.27.0"
